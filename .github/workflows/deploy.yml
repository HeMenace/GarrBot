name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Regenerates public/wotd/*.png and src/data/wotd-words.ts from
      # assets/wotd/base.png + data/words.txt, so editing the word list and
      # pushing is the only maintenance this project ever needs.
      - run: npm run render-wotd

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
